<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WhisperBox — Encrypted Messaging</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --bg2: #111418;
    --bg3: #181d23;
    --bg4: #1e242c;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --accent: #00e5b4;
    --accent2: #00b88f;
    --accent-dim: rgba(0,229,180,0.1);
    --accent-dim2: rgba(0,229,180,0.15);
    --text: #e8edf2;
    --text2: #8a96a3;
    --text3: #4d5a68;
    --danger: #ff4d6d;
    --danger-dim: rgba(255,77,109,0.1);
    --warn: #f5a623;
    --success: #00e5b4;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-w: 300px;
    --header-h: 60px;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }

  .screen { display: none; width: 100%; height: 100vh; }
  .screen.active { display: flex; }

  /* ── AUTH ──────────────────────────────────────── */
  #auth-screen {
    align-items: center; justify-content: center;
    background: var(--bg); position: relative; overflow: hidden;
  }
  #auth-screen::before {
    content:''; position:absolute; width:600px; height:600px;
    background: radial-gradient(circle, rgba(0,229,180,0.06) 0%, transparent 70%);
    top:-100px; right:-100px; pointer-events:none;
  }
  #auth-screen::after {
    content:''; position:absolute; width:400px; height:400px;
    background: radial-gradient(circle, rgba(0,229,180,0.04) 0%, transparent 70%);
    bottom:-50px; left:-50px; pointer-events:none;
  }

  .auth-box {
    width: 420px; background: var(--bg2);
    border: 1px solid var(--border2); border-radius: 20px;
    padding: 40px; position: relative; z-index: 1;
    box-shadow: 0 0 80px rgba(0,0,0,0.4);
  }

  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
  .logo-icon {
    width: 36px; height: 36px; background: var(--accent); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 18px; height: 18px; }
  .logo-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .logo-name span { color: var(--accent); }

  .auth-tabs {
    display: flex; gap: 4px; background: var(--bg3); padding: 4px;
    border-radius: var(--radius-sm); margin-bottom: 28px;
  }
  .auth-tab {
    flex: 1; padding: 8px; border: none; background: none; cursor: pointer;
    color: var(--text2); font-family: var(--sans); font-size: 14px; font-weight: 500;
    border-radius: 6px; transition: all 0.2s;
  }
  .auth-tab.active { background: var(--bg2); color: var(--text); }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; font-family: var(--mono); }
  .form-input {
    width: 100%; padding: 12px 14px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: var(--mono); font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text3); }

  .btn {
    width: 100%; padding: 13px; background: var(--accent); color: var(--bg);
    border: none; border-radius: var(--radius-sm); font-family: var(--sans);
    font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    margin-top: 8px;
  }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--text2); border: 1px solid var(--border2);
    margin-top: 10px;
  }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }

  .auth-msg {
    font-size: 13px; font-family: var(--mono); padding: 10px 12px;
    border-radius: var(--radius-sm); margin-top: 12px; display: none;
  }
  .auth-msg.error { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(255,77,109,0.2); display: block; }
  .auth-msg.success { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,229,180,0.2); display: block; }
  .auth-msg.info { background: var(--bg3); color: var(--text2); display: block; }

  /* ── APP ───────────────────────────────────────── */
  #app-screen { flex-direction: row; height: 100vh; }

  .sidebar {
    width: var(--sidebar-w); height: 100vh; background: var(--bg2);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    height: var(--header-h); padding: 0 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .sidebar-logo { display: flex; align-items: center; gap: 8px; }
  .sidebar-logo-icon {
    width: 28px; height: 28px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-logo-icon svg { width: 14px; height: 14px; }
  .sidebar-logo-name { font-size: 16px; font-weight: 700; }
  .sidebar-logo-name span { color: var(--accent); }

  .sidebar-tabs {
    display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sidebar-tab {
    flex: 1; padding: 11px 0; border: none; background: none; cursor: pointer;
    color: var(--text3); font-family: var(--sans); font-size: 13px; font-weight: 600;
    border-bottom: 2px solid transparent; transition: all 0.2s; letter-spacing: 0.3px;
  }
  .sidebar-tab:hover { color: var(--text2); }
  .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .sidebar-panel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: transparent; border: 1px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text2); transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  .icon-btn svg { width: 16px; height: 16px; }

  .search-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .search-input {
    width: 100%; padding: 8px 12px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: var(--mono); font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  .section-label {
    padding: 12px 16px 6px; flex-shrink: 0;
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text3); font-family: var(--mono);
  }

  .conv-list, .people-list { flex: 1; overflow-y: auto; }
  .conv-list::-webkit-scrollbar,
  .people-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb,
  .people-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .conv-item {
    padding: 12px 16px; cursor: pointer; transition: background 0.15s;
    border-bottom: 1px solid var(--border); position: relative;
    display: flex; align-items: center; gap: 12px;
  }
  .conv-item:hover { background: var(--bg3); }
  .conv-item.active { background: var(--accent-dim); }
  .conv-item.active::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent);
  }

  .people-item {
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
  }
  .people-item:hover { background: var(--bg3); }
  .people-item:hover .people-msg-btn { opacity: 1; }
  .people-msg-btn {
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    background: var(--accent-dim); border: 1px solid rgba(0,229,180,0.25); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); transition: all 0.15s; opacity: 0; flex-shrink: 0;
  }
  .people-msg-btn:hover { background: var(--accent-dim2); }
  .people-msg-btn svg { width: 14px; height: 14px; }

  .conv-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--bg4);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 600; color: var(--accent);
    flex-shrink: 0; text-transform: uppercase;
  }
  .conv-meta { flex: 1; min-width: 0; }
  .conv-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .conv-preview { font-size: 12px; color: var(--text2); font-family: var(--mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-time { font-size: 10px; color: var(--text3); font-family: var(--mono); flex-shrink: 0; }

  .sidebar-footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .my-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--accent-dim);
    border: 1px solid var(--accent); display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 700; color: var(--accent);
    flex-shrink: 0; text-transform: uppercase;
  }
  .my-info { flex: 1; min-width: 0; }
  .my-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .my-key-status {
    font-size: 10px; font-family: var(--mono); color: var(--accent);
    display: flex; align-items: center; gap: 4px; margin-top: 1px;
  }
  .key-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  /* ── Chat main ───────────────────────────────── */
  .chat-main {
    flex: 1; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
  }

  .chat-header {
    height: var(--header-h); padding: 0 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg2); flex-shrink: 0;
  }
  .chat-header-info { display: flex; align-items: center; gap: 12px; }
  .chat-header-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg3);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 600; color: var(--accent);
    text-transform: uppercase;
  }
  .chat-header-name { font-size: 15px; font-weight: 600; }
  .chat-header-sub { font-size: 11px; font-family: var(--mono); color: var(--accent); margin-top: 1px; display: flex; align-items: center; gap: 4px; }

  .enc-badge {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px;
    background: var(--accent-dim); border: 1px solid rgba(0,229,180,0.2);
    border-radius: 20px; font-size: 11px; font-family: var(--mono); color: var(--accent);
  }
  .enc-badge svg { width: 12px; height: 12px; }

  .messages-area {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg-wrap { display: flex; align-items: flex-end; gap: 8px; }
  .msg-wrap.me { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg3);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 600; color: var(--text2);
    flex-shrink: 0; text-transform: uppercase;
  }

  .msg-bubble {
    max-width: 65%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.55; position: relative;
  }
  .msg-wrap.them .msg-bubble {
    background: var(--bg3); border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-wrap.me .msg-bubble {
    background: var(--accent-dim2); border: 1px solid rgba(0,229,180,0.25);
    color: var(--text); border-bottom-right-radius: 4px;
  }

  .msg-meta { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .msg-wrap.me .msg-meta { justify-content: flex-end; }
  .msg-enc-tick { color: var(--accent); }

  .no-conv {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: var(--text3);
  }
  .no-conv-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--bg3); border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
  }
  .no-conv-icon svg { width: 32px; height: 32px; opacity: 0.4; }
  .no-conv h3 { font-size: 16px; color: var(--text2); }
  .no-conv p { font-size: 13px; text-align: center; max-width: 260px; line-height: 1.6; }

  .composer {
    padding: 16px 20px; border-top: 1px solid var(--border);
    background: var(--bg2); flex-shrink: 0;
  }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 10px 14px;
    transition: border-color 0.2s;
  }
  .composer-inner:focus-within { border-color: var(--accent); }
  .composer-input {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5;
    max-height: 120px; overflow-y: auto;
  }
  .composer-input::placeholder { color: var(--text3); }
  .send-btn {
    width: 36px; height: 36px; background: var(--accent); border: none;
    border-radius: var(--radius-sm); cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.2s; color: var(--bg);
  }
  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .composer-info {
    display: flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 10px; font-family: var(--mono); color: var(--text3);
  }
  .composer-info svg { width: 10px; height: 10px; color: var(--accent); }

  /* ── Modals ──────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    width: 420px; background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 20px; padding: 28px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);
    max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; flex-shrink: 0; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-shrink: 0; }
  .modal-actions .btn { margin-top: 0; }
  .modal-scroll { overflow-y: auto; flex: 1; }
  .modal-scroll::-webkit-scrollbar { width: 4px; }
  .modal-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .user-pick-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .user-pick-label {
    font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text3); font-family: var(--mono); margin-bottom: 6px;
  }
  .user-pick-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
  }
  .user-pick-item:hover { background: var(--bg4); border-color: var(--border2); }
  .user-pick-item.selected { border-color: var(--accent); background: var(--accent-dim); }
  .user-pick-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg4);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 600; color: var(--accent);
    flex-shrink: 0; text-transform: uppercase;
  }
  .user-pick-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .user-pick-handle { font-size: 11px; font-family: var(--mono); color: var(--text3); }
  .user-pick-tick {
    margin-left: auto; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); display: none; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .user-pick-item.selected .user-pick-tick { display: flex; }
  .user-pick-tick svg { width: 10px; height: 10px; color: var(--bg); }
  .user-pick-empty { font-size: 12px; font-family: var(--mono); color: var(--text3); padding: 12px 0; text-align: center; }

  /* ── Toast ───────────────────────────────────── */
  .toast-container {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px;
    font-family: var(--mono); max-width: 300px;
    animation: slideIn 0.3s ease;
  }
  .toast.success { background: var(--bg3); border: 1px solid rgba(0,229,180,0.3); color: var(--accent); }
  .toast.error { background: var(--bg3); border: 1px solid rgba(255,77,109,0.3); color: var(--danger); }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sys-msg {
    text-align: center; font-size: 11px; font-family: var(--mono);
    color: var(--text3); padding: 4px 0;
  }
  .sys-msg span { padding: 3px 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; }

  textarea { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen active">
  <div class="auth-box">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#0a0c0f">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <line x1="9" y1="10" x2="15" y2="10"/>
        </svg>
      </div>
      <div class="logo-name">Whisper<span>Box</span></div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="login-user" type="text" placeholder="your_username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
      <div class="auth-msg" id="login-msg"></div>
    </div>

    <div id="register-form" style="display:none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="reg-user" type="text" placeholder="choose_username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Display Name (optional)</label>
        <input class="form-input" id="reg-display" type="text" placeholder="Your Name"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <button class="btn" id="reg-btn" onclick="doRegister()">Create Account</button>
      <div class="auth-msg" id="reg-msg"></div>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen" class="screen">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#0a0c0f">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="sidebar-logo-name">Whisper<span>Box</span></div>
      </div>

    </div>
  </div>

<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════
//  LOCAL STORAGE SCHEMA
//  wb_users       → { [username]: { passwordHash, displayName, publicKey, createdAt } }
//  wb_messages    → [ { id, sender, recipient, ciphertext, iv, encryptedKey, timestamp } ]
//  wb_session     → { username } | null
//  wb_privkey_[u] → base64 pkcs8 private key
// ═══════════════════════════════════════════════════════

// ── UTILS ────────────────────────────────────────────────

function b64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function unb64(s) {
  const bin = atob(s);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function unb64buf(s) { return unb64(s).buffer; }

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function showMsg(id, msg, type = 'error') {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = `auth-msg ${type}`;
  el.textContent = msg;
}

function hideMsg(id) {
  const el = document.getElementById(id);
  if (el) { el.className = 'auth-msg'; el.textContent = ''; }
}

function setBtn(id, loading, label) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = loading;
  if (!loading && label) btn.textContent = label;
  if (loading) btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;vertical-align:middle"></span>';
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(typeof ts === 'number' && ts < 1e12 ? ts * 1000 : ts);
  const diff = Date.now() - d;
  if (diff < 60000) return 'now';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m`;
  if (diff < 86400000) return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  return d.toLocaleDateString([], { month:'short', day:'numeric' });
}

// ── LOCAL STORAGE HELPERS ────────────────────────────────

function lsGet(key, fallback = null) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch { return false; }
}
function lsDel(key) { try { localStorage.removeItem(key); } catch {} }

function getUsers() { return lsGet('wb_users', {}); }
function saveUsers(u) { lsSet('wb_users', u); }
function getMessages() { return lsGet('wb_messages', []); }
function saveMessages(m) { lsSet('wb_messages', m); }
function getSession() { return lsGet('wb_session', null); }
function saveSession(s) { lsSet('wb_session', s); }
function clearSession() { lsDel('wb_session'); }
function getPrivKey(username) { return localStorage.getItem(`wb_privkey_${username}`); }
function setPrivKey(username, b64key) { localStorage.setItem(`wb_privkey_${username}`, b64key); }

// ── CRYPTO ───────────────────────────────────────────────

async function hashPassword(password) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(password));
  return b64(buf);
}

async function generateKeyPair() {
  return crypto.subtle.generateKey(
    { name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256' },
    true, ['encrypt','decrypt']
  );
}
async function exportPublicKey(key) { return b64(await crypto.subtle.exportKey('spki', key)); }
async function exportPrivateKey(key) { return b64(await crypto.subtle.exportKey('pkcs8', key)); }
async function importPublicKey(b64str) {
  return crypto.subtle.importKey('spki', unb64buf(b64str), { name:'RSA-OAEP', hash:'SHA-256' }, false, ['encrypt']);
}
async function importPrivateKey(b64str) {
  return crypto.subtle.importKey('pkcs8', unb64buf(b64str), { name:'RSA-OAEP', hash:'SHA-256' }, false, ['decrypt']);
}

async function encryptMessage(plaintext, recipientPublicKey) {
  const aesKey = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, aesKey, enc.encode(plaintext));
  const rawAES = await crypto.subtle.exportKey('raw', aesKey);
  const encryptedKey = await crypto.subtle.encrypt({ name:'RSA-OAEP' }, recipientPublicKey, rawAES);
  return {
    ciphertext: b64(ciphertext),
    iv: b64(iv.buffer),
    encrypted_key: b64(encryptedKey)
  };
}

async function decryptMessage(ciphertext, iv, encrypted_key, privateKey) {
  const rawAES = await crypto.subtle.decrypt({ name:'RSA-OAEP' }, privateKey, unb64buf(encrypted_key));
  const aesKey = await crypto.subtle.importKey('raw', rawAES, { name:'AES-GCM' }, false, ['decrypt']);
  const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(iv) }, aesKey, unb64buf(ciphertext));
  return new TextDecoder().decode(plainBuf);
}

// ── APP STATE ────────────────────────────────────────────

let state = {
  username: null,
  privateKey: null,
  activeConv: null,
  cachedPubKeys: {},
  messageCache: {},   // { partner: [ {msg, _decrypted} ] }
};

// ── AUTH ─────────────────────────────────────────────────

function switchTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  hideMsg('login-msg'); hideMsg('reg-msg');
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim().toLowerCase();
  const displayName = document.getElementById('reg-display').value.trim();
  const password = document.getElementById('reg-pass').value;
  hideMsg('reg-msg');

  if (!username) return showMsg('reg-msg', 'Username is required');
  if (username.length < 3) return showMsg('reg-msg', 'Username must be at least 3 characters');
  if (!/^[a-z0-9_]+$/.test(username)) return showMsg('reg-msg', 'Username: letters, numbers and underscores only');
  if (!password) return showMsg('reg-msg', 'Password is required');
  if (password.length < 6) return showMsg('reg-msg', 'Password must be at least 6 characters');

  const users = getUsers();
  if (users[username]) return showMsg('reg-msg', 'Username already taken');

  setBtn('reg-btn', true);
  showMsg('reg-msg', 'Generating encryption keys…', 'info');

  try {
    const keyPair = await generateKeyPair();
    const pubKeyB64 = await exportPublicKey(keyPair.publicKey);
    const privKeyB64 = await exportPrivateKey(keyPair.privateKey);
    const passwordHash = await hashPassword(password);

    users[username] = {
      passwordHash,
      displayName: displayName || username,
      publicKey: pubKeyB64,
      createdAt: Date.now()
    };
    saveUsers(users);
    setPrivKey(username, privKeyB64);

    showMsg('reg-msg', 'Account created! Signing you in…', 'success');
    setTimeout(() => {
      document.getElementById('login-user').value = username;
      document.getElementById('login-pass').value = password;
      switchTab('login');
      doLogin();
    }, 800);
  } catch (e) {
    showMsg('reg-msg', 'Error: ' + e.message);
  } finally {
    setBtn('reg-btn', false, 'Create Account');
  }
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim().toLowerCase();
  const password = document.getElementById('login-pass').value;
  hideMsg('login-msg');

  if (!username || !password) return showMsg('login-msg', 'Please fill in all fields');

  const users = getUsers();
  const user = users[username];
  if (!user) return showMsg('login-msg', 'No account found with that username');

  setBtn('login-btn', true);
  showMsg('login-msg', 'Verifying…', 'info');

  try {
    const hash = await hashPassword(password);
    if (hash !== user.passwordHash) {
      showMsg('login-msg', 'Incorrect password');
      return;
    }

    const privKeyB64 = getPrivKey(username);
    if (!privKeyB64) {
      showMsg('login-msg', 'Private key not found on this device. Register again or use the original device.');
      return;
    }

    const privateKey = await importPrivateKey(privKeyB64);
    state.username = username;
    state.privateKey = privateKey;
    state.activeConv = null;
    state.messageCache = {};
    state.cachedPubKeys = {};

    saveSession({ username });
    hideMsg('login-msg');
    enterApp();
  } catch (e) {
    showMsg('login-msg', 'Login error: ' + e.message);
  } finally {
    setBtn('login-btn', false, 'Sign In');
  }
}

function doLogout() {
  clearSession();
  state = { username:null, privateKey:null, activeConv:null, cachedPubKeys:{}, messageCache:{} };
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').classList.add('active');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
  showToast('Signed out.', 'success');
}

// ── APP INIT ─────────────────────────────────────────────

async function bootApp() {
  // Try restore session
  const session = getSession();
  if (session && session.username) {
    const users = getUsers();
    if (users[session.username]) {
      const privKeyB64 = getPrivKey(session.username);
      if (privKeyB64) {
        try {
          const privateKey = await importPrivateKey(privKeyB64);
          state.username = session.username;
          state.privateKey = privateKey;
          enterApp();
          return;
        } catch {}
      }
    }
    clearSession();
  }
  // Show auth
  document.getElementById('auth-screen').classList.add('active');
  document.getElementById('auth-screen').style.display = 'flex';
}

function enterApp() {
  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('app-screen').style.display = 'flex';

  const users = getUsers();
  const user = users[state.username] || {};
  document.getElementById('my-username-display').textContent = user.displayName || state.username;
  document.getElementById('my-avatar').textContent = (state.username[0] || '?').toUpperCase();

  renderConvList();
  renderPeopleList();
  switchSidebarTab('chats');

  // Poll for new incoming messages every 3s (simulate real-time)
  if (window._pollTimer) clearInterval(window._pollTimer);
  window._pollTimer = setInterval(checkNewMessages, 3000);
}

// ── SIDEBAR TABS ─────────────────────────────────────────

function switchSidebarTab(tab) {
  const isChats = tab === 'chats';
  document.getElementById('stab-chats').classList.toggle('active', isChats);
  document.getElementById('stab-people').classList.toggle('active', !isChats);
  document.getElementById('panel-chats').style.display = isChats ? 'flex' : 'none';
  document.getElementById('panel-people').style.display = isChats ? 'none' : 'flex';
}

// ── PEOPLE PANEL ─────────────────────────────────────────

function renderPeopleList() {
  const list = document.getElementById('people-list');
  const q = (document.getElementById('people-search')?.value || '').toLowerCase();
  const users = getUsers();
  const otherUsers = Object.entries(users)
    .filter(([u]) => u !== state.username)
    .filter(([u, data]) =>
      !q || u.includes(q) || (data.displayName || '').toLowerCase().includes(q)
    );

  if (Object.keys(users).filter(u => u !== state.username).length === 0) {
    list.innerHTML = `<div style="padding:32px 20px;text-align:center">
      <p style="font-size:13px;color:var(--text3);font-family:var(--mono)">No other users yet.</p>
      <p style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:6px;line-height:1.7">Register another account to start chatting.</p>
    </div>`;
    return;
  }

  if (otherUsers.length === 0) {
    list.innerHTML = '<div style="padding:24px 20px;text-align:center"><p style="font-size:13px;color:var(--text3);font-family:var(--mono)">No users match your search.</p></div>';
    return;
  }

  list.innerHTML = otherUsers.map(([username, data]) => {
    const msgs = getConvMessages(username);
    const hasConv = msgs.length > 0;
    return `<div class="people-item" onclick="startChatWith('${escHtml(username)}')">
      <div class="conv-avatar">${username[0].toUpperCase()}</div>
      <div class="conv-meta">
        <div class="conv-name">${escHtml(data.displayName || username)}</div>
        <div class="conv-preview" style="color:var(--text3)">@${escHtml(username)}${hasConv ? ' · <span style="color:var(--accent)">existing chat</span>' : ''}</div>
      </div>
      <button class="people-msg-btn" title="Message"
        onclick="event.stopPropagation();startChatWith('${escHtml(username)}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>`;
  }).join('');
}

function startChatWith(username) {
  switchSidebarTab('chats');
  openConversation(username);
  renderConvList();
}

// ── CONVERSATIONS ─────────────────────────────────────────

function getConvMessages(partner) {
  const all = getMessages();
  return all.filter(m =>
    (m.sender === state.username && m.recipient === partner) ||
    (m.sender === partner && m.recipient === state.username)
  ).sort((a, b) => a.id - b.id);
}

function getConvPartners() {
  const all = getMessages();
  const partners = new Set();
  for (const m of all) {
    if (m.sender === state.username) partners.add(m.recipient);
    if (m.recipient === state.username) partners.add(m.sender);
  }
  return [...partners];
}

function renderConvList() {
  const list = document.getElementById('conv-list');
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const users = getUsers();

  const partners = getConvPartners()
    .filter(p => !q || p.includes(q) || (users[p]?.displayName || '').toLowerCase().includes(q));

  // Sort by last message time
  const allMsgs = getMessages();
  partners.sort((a, b) => {
    const aLast = allMsgs.filter(m => m.sender===a||m.recipient===a).at(-1)?.timestamp ?? 0;
    const bLast = allMsgs.filter(m => m.sender===b||m.recipient===b).at(-1)?.timestamp ?? 0;
    return bLast - aLast;
  });

  if (partners.length === 0) {
    list.innerHTML = `<div style="padding:40px 20px;text-align:center">
      <p style="font-size:13px;color:var(--text3)">No conversations yet.<br/>Go to <strong style="color:var(--text2)">People</strong> to find users.</p>
    </div>`;
    return;
  }

  list.innerHTML = partners.map(partner => {
    const msgs = getConvMessages(partner);
    const last = msgs.at(-1);
    const isActive = state.activeConv === partner;
    const time = last ? formatTime(last.timestamp) : '';
    const cached = state.messageCache[partner];
    const lastCached = cached?.find(c => c.msg.id === last?.id);
    const preview = lastCached?._decrypted ? lastCached._decrypted.slice(0, 40) : (last ? '🔒 Encrypted' : '');
    const displayName = users[partner]?.displayName || partner;

    return `<div class="conv-item ${isActive ? 'active' : ''}" onclick="openConversation('${escHtml(partner)}')">
      <div class="conv-avatar">${partner[0].toUpperCase()}</div>
      <div class="conv-meta">
        <div class="conv-name">${escHtml(displayName)}</div>
        <div class="conv-preview">${escHtml(preview)}</div>
      </div>
      <div class="conv-time">${time}</div>
    </div>`;
  }).join('');
}

// ── OPEN CONVERSATION ─────────────────────────────────────

async function openConversation(partner) {
  state.activeConv = partner;
  renderConvList();

  const users = getUsers();
  const partnerData = users[partner] || {};
  const main = document.getElementById('chat-main');

  main.innerHTML = `
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-avatar">${partner[0].toUpperCase()}</div>
        <div>
          <div class="chat-header-name">${escHtml(partnerData.displayName || partner)}</div>
          <div class="chat-header-sub"><div class="key-dot"></div>End-to-end encrypted</div>
        </div>
      </div>
      <div class="enc-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        AES-GCM + RSA-OAEP
      </div>
    </div>
    <div class="messages-area" id="messages-area">
      <div class="sys-msg"><span>Messages are end-to-end encrypted</span></div>
      <div style="text-align:center;padding:20px"><span class="spinner"></span></div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea class="composer-input" id="composer-input" rows="1"
          placeholder="Message ${escHtml(partnerData.displayName || partner)}…"
          onkeydown="handleComposerKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="composer-info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Encrypted before sending · Stored as ciphertext only
      </div>
    </div>`;

  await renderMessages(partner);
  document.getElementById('composer-input')?.focus();
}

async function renderMessages(partner) {
  const area = document.getElementById('messages-area');
  if (!area) return;

  const msgs = getConvMessages(partner);

  // Init cache for this partner
  if (!state.messageCache[partner]) state.messageCache[partner] = [];
  const cache = state.messageCache[partner];

  area.innerHTML = '<div class="sys-msg"><span>Messages are end-to-end encrypted</span></div>';

  for (const msg of msgs) {
    const isMe = msg.sender === state.username;
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${isMe ? 'me' : 'them'}`;

    // Find cached decrypted text
    let cached = cache.find(c => c.msg.id === msg.id);
    let text, failed = false;

    if (cached) {
      text = cached._decrypted;
      failed = cached._failed;
    } else {
      if (isMe && msg._plaintext) {
        // Sender stored plaintext in-memory
        text = msg._plaintext;
      } else {
        try {
          text = await decryptMessage(msg.ciphertext, msg.iv, msg.encrypted_key, state.privateKey);
        } catch {
          text = '[Decryption failed]';
          failed = true;
        }
      }
      cache.push({ msg, _decrypted: text, _failed: failed });
    }

    const ts = formatTime(msg.timestamp);
    const initials = (isMe ? state.username : partner)[0].toUpperCase();

    wrap.innerHTML = `
      ${!isMe ? `<div class="msg-avatar">${initials}</div>` : ''}
      <div>
        <div class="msg-bubble${failed ? '" style="color:var(--danger);font-style:italic' : ''}">${escHtml(text)}</div>
        <div class="msg-meta">${ts} <span class="msg-enc-tick">🔒</span></div>
      </div>
      ${isMe ? `<div class="msg-avatar">${initials}</div>` : ''}`;
    area.appendChild(wrap);
  }

  area.scrollTop = area.scrollHeight;
}

// ── SEND MESSAGE ─────────────────────────────────────────

async function getRecipientPublicKey(username) {
  if (state.cachedPubKeys[username]) return state.cachedPubKeys[username];
  const users = getUsers();
  const user = users[username];
  if (!user) throw new Error(`User "${username}" not found`);
  if (!user.publicKey) throw new Error(`No public key for "${username}"`);
  const key = await importPublicKey(user.publicKey);
  state.cachedPubKeys[username] = key;
  return key;
}

async function sendMessage() {
  const input = document.getElementById('composer-input');
  const plaintext = input?.value.trim();
  if (!plaintext) return;

  const partner = state.activeConv;
  const btn = document.getElementById('send-btn');
  if (btn) btn.disabled = true;
  if (input) input.disabled = true;

  try {
    const recipientKey = await getRecipientPublicKey(partner);
    const { ciphertext, iv, encrypted_key } = await encryptMessage(plaintext, recipientKey);

    const allMsgs = getMessages();
    const id = Date.now();
    const msg = {
      id, sender: state.username, recipient: partner,
      ciphertext, iv, encrypted_key,
      timestamp: Date.now()
    };
    allMsgs.push(msg);
    saveMessages(allMsgs);

    // Cache plaintext for sender's own view
    if (!state.messageCache[partner]) state.messageCache[partner] = [];
    state.messageCache[partner].push({ msg, _decrypted: plaintext, _failed: false });

    if (input) { input.value = ''; input.style.height = 'auto'; }
    await renderMessages(partner);
    renderConvList();
  } catch (e) {
    showToast('Send failed: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
    if (input) { input.disabled = false; input.focus(); }
  }
}

// ── POLL FOR NEW MESSAGES ─────────────────────────────────

let _lastMsgCount = 0;
async function checkNewMessages() {
  const all = getMessages();
  if (all.length === _lastMsgCount) return;

  const newMsgs = all.slice(_lastMsgCount).filter(m => m.recipient === state.username);
  _lastMsgCount = all.length;

  for (const msg of newMsgs) {
    if (msg.sender !== state.activeConv) {
      const users = getUsers();
      const name = users[msg.sender]?.displayName || msg.sender;
      showToast(`New message from ${name}`, 'success');
    }
  }

  renderConvList();
  if (state.activeConv) await renderMessages(state.activeConv);
}

// ── NEW MESSAGE MODAL ─────────────────────────────────────

let selectedRecipient = null;

function openNewMsg() {
  selectedRecipient = null;
  document.getElementById('new-msg-recipient').value = '';
  document.getElementById('new-msg-body').value = '';
  hideMsg('new-msg-error');
  document.getElementById('new-msg-modal').classList.add('open');
  renderModalUsers('');
  setTimeout(() => document.getElementById('new-msg-body').focus(), 100);
}

function renderModalUsers(q) {
  const listEl = document.getElementById('modal-user-list');
  const users = getUsers();
  const others = Object.entries(users).filter(([u]) => u !== state.username);
  const filtered = others.filter(([u, d]) =>
    !q || u.includes(q.toLowerCase()) || (d.displayName || '').toLowerCase().includes(q.toLowerCase())
  );

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="user-pick-empty">${others.length === 0 ? 'No other users registered yet.' : 'No users match.'}</div>`;
    return;
  }

  listEl.innerHTML = filtered.slice(0, 8).map(([username, data]) => `
    <div class="user-pick-item ${selectedRecipient === username ? 'selected' : ''}"
         onclick="selectRecipient('${escHtml(username)}')">
      <div class="user-pick-avatar">${username[0].toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div class="user-pick-name">${escHtml(data.displayName || username)}</div>
        <div class="user-pick-handle">@${escHtml(username)}</div>
      </div>
      <div class="user-pick-tick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>`).join('');
}

function selectRecipient(username) {
  selectedRecipient = username;
  document.getElementById('new-msg-recipient').value = username;
  renderModalUsers(username);
}

function onRecipientInput() {
  const val = document.getElementById('new-msg-recipient').value.trim();
  if (val !== selectedRecipient) selectedRecipient = null;
  renderModalUsers(val);
}

function closeNewMsg() {
  document.getElementById('new-msg-modal').classList.remove('open');
  selectedRecipient = null;
}

async function sendNewMsg() {
  const recipientInput = document.getElementById('new-msg-recipient').value.trim().toLowerCase();
  const recipient = selectedRecipient || recipientInput;
  const body = document.getElementById('new-msg-body').value.trim();
  hideMsg('new-msg-error');

  if (!recipient) return showMsg('new-msg-error', 'Please select or type a recipient');
  if (!body) return showMsg('new-msg-error', 'Please enter a message');
  if (recipient === state.username) return showMsg('new-msg-error', "You can't message yourself");

  const users = getUsers();
  if (!users[recipient]) return showMsg('new-msg-error', `User "${recipient}" not found`);

  showMsg('new-msg-error', 'Encrypting…', 'info');

  try {
    const recipientKey = await getRecipientPublicKey(recipient);
    const { ciphertext, iv, encrypted_key } = await encryptMessage(body, recipientKey);

    const allMsgs = getMessages();
    const id = Date.now();
    const msg = { id, sender: state.username, recipient, ciphertext, iv, encrypted_key, timestamp: Date.now() };
    allMsgs.push(msg);
    saveMessages(allMsgs);

    if (!state.messageCache[recipient]) state.messageCache[recipient] = [];
    state.messageCache[recipient].push({ msg, _decrypted: body, _failed: false });

    closeNewMsg();
    showToast('Message encrypted and sent', 'success');
    switchSidebarTab('chats');
    openConversation(recipient);
    renderConvList();
  } catch (e) {
    showMsg('new-msg-error', e.message);
  }
}

// ── UI HELPERS ────────────────────────────────────────────

function handleComposerKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

document.getElementById('new-msg-modal').addEventListener('click', function(e) {
  if (e.target === this) closeNewMsg();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('login-form').style.display !== 'none' &&
        document.activeElement?.closest('#login-form')) doLogin();
    if (document.getElementById('register-form').style.display !== 'none' &&
        document.activeElement?.closest('#register-form')) doRegister();
  }
});

// ── BOOT ─────────────────────────────────────────────────
bootApp();
</script>
