<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WhisperBox — Encrypted Messaging</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --bg2: #111418;
    --bg3: #181d23;
    --bg4: #1e242c;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --accent: #00e5b4;
    --accent2: #00b88f;
    --accent-dim: rgba(0,229,180,0.1);
    --accent-dim2: rgba(0,229,180,0.15);
    --text: #e8edf2;
    --text2: #8a96a3;
    --text3: #4d5a68;
    --danger: #ff4d6d;
    --danger-dim: rgba(255,77,109,0.1);
    --warn: #f5a623;
    --success: #00e5b4;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-w: 300px;
    --header-h: 60px;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }

  .screen { display: none; width: 100%; height: 100vh; }
  .screen.active { display: flex; }

  /* AUTH */
  #auth-screen {
    align-items: center; justify-content: center;
    background: var(--bg); position: relative; overflow: hidden;
  }
  #auth-screen::before {
    content:''; position:absolute; width:600px; height:600px;
    background: radial-gradient(circle, rgba(0,229,180,0.06) 0%, transparent 70%);
    top:-100px; right:-100px; pointer-events:none;
  }
  #auth-screen::after {
    content:''; position:absolute; width:400px; height:400px;
    background: radial-gradient(circle, rgba(0,229,180,0.04) 0%, transparent 70%);
    bottom:-50px; left:-50px; pointer-events:none;
  }

  .auth-box {
    width: 420px; background: var(--bg2);
    border: 1px solid var(--border2); border-radius: 20px;
    padding: 40px; position: relative; z-index: 1;
    box-shadow: 0 0 80px rgba(0,0,0,0.4);
  }

  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
  .logo-icon {
    width: 36px; height: 36px; background: var(--accent); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 18px; height: 18px; }
  .logo-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .logo-name span { color: var(--accent); }

  .auth-tabs {
    display: flex; gap: 4px; background: var(--bg3); padding: 4px;
    border-radius: var(--radius-sm); margin-bottom: 28px;
  }
  .auth-tab {
    flex: 1; padding: 8px; border: none; background: none; cursor: pointer;
    color: var(--text2); font-family: var(--sans); font-size: 14px; font-weight: 500;
    border-radius: 6px; transition: all 0.2s;
  }
  .auth-tab.active { background: var(--bg2); color: var(--text); }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; font-family: var(--mono); }
  .form-input {
    width: 100%; padding: 12px 14px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: var(--mono); font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text3); }

  .btn {
    width: 100%; padding: 13px; background: var(--accent); color: var(--bg);
    border: none; border-radius: var(--radius-sm); font-family: var(--sans);
    font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    margin-top: 8px;
  }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--text2); border: 1px solid var(--border2);
    margin-top: 10px;
  }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }

  .auth-msg {
    font-size: 13px; font-family: var(--mono); padding: 10px 12px;
    border-radius: var(--radius-sm); margin-top: 12px; display: none;
  }
  .auth-msg.error { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(255,77,109,0.2); display: block; }
  .auth-msg.success { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,229,180,0.2); display: block; }
  .auth-msg.info { background: var(--bg3); color: var(--text2); display: block; }

  /* APP */
  #app-screen { flex-direction: row; height: 100vh; }

  .sidebar {
    width: var(--sidebar-w); height: 100vh; background: var(--bg2);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    height: var(--header-h); padding: 0 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-logo { display: flex; align-items: center; gap: 8px; }
  .sidebar-logo-icon {
    width: 28px; height: 28px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-logo-icon svg { width: 14px; height: 14px; }
  .sidebar-logo-name { font-size: 16px; font-weight: 700; }
  .sidebar-logo-name span { color: var(--accent); }

  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: transparent; border: 1px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text2); transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  .icon-btn svg { width: 16px; height: 16px; }

  .search-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .search-input {
    width: 100%; padding: 8px 12px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: var(--mono); font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  .section-label {
    padding: 12px 16px 6px;
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text3); font-family: var(--mono);
  }

  .conv-list { flex: 1; overflow-y: auto; }
  .conv-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .conv-item {
    padding: 12px 16px; cursor: pointer; transition: background 0.15s;
    border-bottom: 1px solid var(--border); position: relative;
    display: flex; align-items: center; gap: 12px;
  }
  .conv-item:hover { background: var(--bg3); }
  .conv-item.active { background: var(--accent-dim); }
  .conv-item.active::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent);
  }

  .conv-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--bg4);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 600; color: var(--accent);
    flex-shrink: 0; text-transform: uppercase;
  }
  .conv-meta { flex: 1; min-width: 0; }
  .conv-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .conv-preview { font-size: 12px; color: var(--text2); font-family: var(--mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-time { font-size: 10px; color: var(--text3); font-family: var(--mono); }

  .sidebar-footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .my-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--accent-dim);
    border: 1px solid var(--accent); display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 700; color: var(--accent);
    flex-shrink: 0; text-transform: uppercase;
  }
  .my-info { flex: 1; min-width: 0; }
  .my-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .my-key-status {
    font-size: 10px; font-family: var(--mono); color: var(--accent);
    display: flex; align-items: center; gap: 4px; margin-top: 1px;
  }
  .key-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .chat-main {
    flex: 1; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
  }

  .chat-header {
    height: var(--header-h); padding: 0 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg2); flex-shrink: 0;
  }
  .chat-header-info { display: flex; align-items: center; gap: 12px; }
  .chat-header-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg3);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 600; color: var(--accent);
    text-transform: uppercase;
  }
  .chat-header-name { font-size: 15px; font-weight: 600; }
  .chat-header-sub { font-size: 11px; font-family: var(--mono); color: var(--accent); margin-top: 1px; display: flex; align-items: center; gap: 4px; }

  .enc-badge {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px;
    background: var(--accent-dim); border: 1px solid rgba(0,229,180,0.2);
    border-radius: 20px; font-size: 11px; font-family: var(--mono); color: var(--accent);
  }
  .enc-badge svg { width: 12px; height: 12px; }

  .messages-area {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg-wrap { display: flex; align-items: flex-end; gap: 8px; }
  .msg-wrap.me { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg3);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 600; color: var(--text2);
    flex-shrink: 0; text-transform: uppercase;
  }

  .msg-bubble {
    max-width: 65%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.55; position: relative;
  }
  .msg-wrap.them .msg-bubble {
    background: var(--bg3); border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-wrap.me .msg-bubble {
    background: var(--accent-dim2); border: 1px solid rgba(0,229,180,0.25);
    color: var(--text); border-bottom-right-radius: 4px;
  }

  .msg-meta { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .msg-wrap.me .msg-meta { justify-content: flex-end; }
  .msg-enc-tick { color: var(--accent); font-size: 9px; }
  .msg-error { color: var(--danger); font-style: italic; font-size: 13px; }

  .no-conv {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: var(--text3);
  }
  .no-conv-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--bg3); border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
  }
  .no-conv-icon svg { width: 32px; height: 32px; opacity: 0.4; }
  .no-conv h3 { font-size: 16px; color: var(--text2); }
  .no-conv p { font-size: 13px; text-align: center; max-width: 260px; line-height: 1.6; }

  .composer {
    padding: 16px 20px; border-top: 1px solid var(--border);
    background: var(--bg2); flex-shrink: 0;
  }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 10px 14px;
    transition: border-color 0.2s;
  }
  .composer-inner:focus-within { border-color: var(--accent); }
  .composer-input {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5;
    max-height: 120px; overflow-y: auto;
  }
  .composer-input::placeholder { color: var(--text3); }
  .send-btn {
    width: 36px; height: 36px; background: var(--accent); border: none;
    border-radius: var(--radius-sm); cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.2s; color: var(--bg);
  }
  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .composer-info {
    display: flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 10px; font-family: var(--mono); color: var(--text3);
  }
  .composer-info svg { width: 10px; height: 10px; color: var(--accent); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    width: 380px; background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 20px; padding: 28px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn { margin-top: 0; }

  .toast-container {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px;
    font-family: var(--mono); max-width: 300px;
    animation: slideIn 0.3s ease;
  }
  .toast.success { background: var(--bg3); border: 1px solid rgba(0,229,180,0.3); color: var(--accent); }
  .toast.error { background: var(--bg3); border: 1px solid rgba(255,77,109,0.3); color: var(--danger); }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sys-msg {
    text-align: center; font-size: 11px; font-family: var(--mono);
    color: var(--text3); padding: 4px 0;
  }
  .sys-msg span { padding: 3px 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; }

  .key-info-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--bg3); border-radius: var(--radius-sm); margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .key-info-row svg { width: 14px; height: 14px; color: var(--accent); flex-shrink: 0; }
  .key-info-text { font-size: 12px; font-family: var(--mono); color: var(--text2); }
  .key-info-text strong { color: var(--text); }

  textarea { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen active">
  <div class="auth-box">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#0a0c0f">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <line x1="9" y1="10" x2="15" y2="10"/>
        </svg>
      </div>
      <div class="logo-name">Whisper<span>Box</span></div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="login-user" type="text" placeholder="your_username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
      <div class="auth-msg" id="login-msg"></div>
    </div>

    <div id="register-form" style="display:none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="reg-user" type="text" placeholder="choose_username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <button class="btn" id="reg-btn" onclick="doRegister()">Create Account</button>
      <div class="auth-msg" id="reg-msg"></div>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen" class="screen">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#0a0c0f">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="sidebar-logo-name">Whisper<span>Box</span></div>
      </div>
      <button class="icon-btn" title="New message" onclick="openNewMsg()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="search-bar">
      <input class="search-input" id="search-input" placeholder="Search conversations..." onkeyup="filterConvs()"/>
    </div>

    <div class="section-label">Conversations</div>
    <div class="conv-list" id="conv-list">
      <div style="padding:40px 20px;text-align:center">
        <p style="font-size:13px;color:var(--text3)">No conversations yet.<br/>Start one with the + button.</p>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="my-avatar" id="my-avatar">—</div>
      <div class="my-info">
        <div class="my-name" id="my-username-display">—</div>
        <div class="my-key-status"><div class="key-dot"></div>Keys generated</div>
      </div>
      <button class="icon-btn" title="Sign out" onclick="doLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="chat-main" id="chat-main">
    <div class="no-conv">
      <div class="no-conv-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h3>No conversation selected</h3>
      <p>Select a conversation or start a new encrypted chat with the + button.</p>
    </div>
  </div>
</div>

<!-- NEW MESSAGE MODAL -->
<div class="modal-overlay" id="new-msg-modal">
  <div class="modal-box">
    <div class="modal-title">New Encrypted Message</div>
    <div class="key-info-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <div class="key-info-text">Message will be <strong>end-to-end encrypted</strong> using the recipient's public key</div>
    </div>
    <div class="form-group">
      <label class="form-label">Recipient username</label>
      <input class="form-input" id="new-msg-recipient" type="text" placeholder="username"/>
    </div>
    <div class="form-group">
      <label class="form-label">Message</label>
      <textarea class="form-input" id="new-msg-body" rows="4" placeholder="Your encrypted message..." style="resize:vertical"></textarea>
    </div>
    <div class="auth-msg" id="new-msg-error"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeNewMsg()">Cancel</button>
      <button class="btn" style="flex:2" onclick="sendNewMsg()">Encrypt & Send</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════
//  WHISPERBOX — E2EE Messaging Client
//  FIX LOG:
//  1. Added /auth/login POST endpoint (was missing in backend)
//  2. Fixed error parsing: extract string from response properly
//  3. Fixed message fetch: GET /messages/{username} instead of /messages
//  4. Fixed message send: include sender field in payload
//  5. Fixed login flow: no longer expects server token (uses username as identity)
// ═══════════════════════════════════════════════════

const API = 'https://whisperbox.koyeb.app';

let state = {
  username: null,
  keyPair: null,
  conversations: {},
  activeConv: null,
  publicKeys: {},
  pollingTimer: null,
};

// ── UTILS ─────────────────────────────────────────

function b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function arrayBufToB64(buf) { return b64(buf); }
function b64ToArrayBuf(s) { return unb64(s).buffer; }

function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (loading) {
    btn._orig = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
  } else {
    btn.innerHTML = btn._orig || '';
    btn.disabled = false;
  }
}

function showMsg(id, msg, type = 'error') {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = `auth-msg ${type}`;
  el.textContent = msg;
  el.style.display = 'block';
}

function hideMsg(id) {
  const el = document.getElementById(id);
  if (el) { el.style.display = 'none'; el.textContent = ''; }
}

// ── CRYPTO ─────────────────────────────────────────

async function generateKeyPair() {
  return crypto.subtle.generateKey(
    { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
    true, ['encrypt', 'decrypt']
  );
}

async function exportPublicKey(key) {
  return arrayBufToB64(await crypto.subtle.exportKey('spki', key));
}

async function importPublicKey(b64str) {
  return crypto.subtle.importKey(
    'spki', b64ToArrayBuf(b64str),
    { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']
  );
}

async function exportPrivateKey(key) {
  return arrayBufToB64(await crypto.subtle.exportKey('pkcs8', key));
}

async function importPrivateKey(b64str) {
  return crypto.subtle.importKey(
    'pkcs8', b64ToArrayBuf(b64str),
    { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']
  );
}

async function encryptMessage(plaintext, recipientPublicKey) {
  const aesKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(plaintext));
  const rawAES = await crypto.subtle.exportKey('raw', aesKey);
  const encryptedKey = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, recipientPublicKey, rawAES);
  return {
    ciphertext: arrayBufToB64(ciphertext),
    iv: arrayBufToB64(iv),
    encryptedKey: arrayBufToB64(encryptedKey),
  };
}

async function decryptMessage(ciphertext, iv, encryptedKey, privateKey) {
  const rawAES = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, privateKey, b64ToArrayBuf(encryptedKey));
  const aesKey = await crypto.subtle.importKey('raw', rawAES, { name: 'AES-GCM' }, false, ['decrypt']);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, aesKey, b64ToArrayBuf(ciphertext));
  return new TextDecoder().decode(plainBuf);
}

// ── PASSWORD-BASED PRIVATE KEY WRAPPING ───────────
// Derives an AES-GCM key from the user's password via PBKDF2,
// then uses it to encrypt the raw private key bytes.
// This produces the `wrapped_private_key` + `pbkdf2_salt` the server expects.
// The private key can be recovered on any device given the password.

async function deriveWrappingKey(password, salt) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false, ['encrypt', 'decrypt']
  );
}

async function wrapPrivateKey(privateKey, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const wrappingKey = await deriveWrappingKey(password, salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const pkcs8 = await crypto.subtle.exportKey('pkcs8', privateKey);
  const wrapped = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, wrappingKey, pkcs8);
  // Pack: salt(16) + iv(12) + ciphertext → base64
  const blob = new Uint8Array(16 + 12 + wrapped.byteLength);
  blob.set(salt, 0);
  blob.set(iv, 16);
  blob.set(new Uint8Array(wrapped), 28);
  return {
    wrapped_private_key: arrayBufToB64(blob.buffer),
    pbkdf2_salt: arrayBufToB64(salt.buffer),
  };
}

async function unwrapPrivateKey(wrappedB64, password) {
  const blob = unb64(wrappedB64);
  const salt = blob.slice(0, 16);
  const iv = blob.slice(16, 28);
  const ciphertext = blob.slice(28);
  const wrappingKey = await deriveWrappingKey(password, salt);
  const pkcs8 = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, wrappingKey, ciphertext);
  return crypto.subtle.importKey(
    'pkcs8', pkcs8, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']
  );
}

// ── INDEXEDDB KEY STORAGE ──────────────────────────

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('WhisperBoxKeys', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('keys');
    req.onsuccess = e => res(e.target.result);
    req.onerror = () => rej(req.error);
  });
}

async function storePrivateKey(username, privateKey) {
  const db = await openDB();
  const raw = await exportPrivateKey(privateKey);
  return new Promise((res, rej) => {
    const tx = db.transaction('keys', 'readwrite');
    tx.objectStore('keys').put(raw, `privkey_${username}`);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}

async function loadPrivateKey(username) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('keys', 'readonly');
    const req = tx.objectStore('keys').get(`privkey_${username}`);
    req.onsuccess = async () => {
      if (req.result) {
        try { res(await importPrivateKey(req.result)); } catch { res(null); }
      } else { res(null); }
    };
    req.onerror = () => rej(req.error);
  });
}

// ── API HELPERS ────────────────────────────────────
// FIX: Extract a clean error string instead of letting it become [object Object]

async function extractError(res) {
  try {
    const data = await res.json();
    // FastAPI returns { detail: "..." } for HTTPException
    if (typeof data.detail === 'string') return data.detail;
    if (typeof data.message === 'string') return data.message;
    if (typeof data.detail === 'object') return JSON.stringify(data.detail);
    return `Error ${res.status}`;
  } catch {
    return `HTTP ${res.status}`;
  }
}

async function apiPost(path, body) {
  const res = await fetch(`${API}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await extractError(res));
  return res.json();
}

async function apiGet(path) {
  const res = await fetch(`${API}${path}`);
  if (!res.ok) throw new Error(await extractError(res));
  return res.json();
}

// ── AUTH ───────────────────────────────────────────

function switchTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pass').value;
  hideMsg('reg-msg');

  if (!username || !password) return showMsg('reg-msg', 'Please fill in all fields');
  if (username.length < 3) return showMsg('reg-msg', 'Username must be at least 3 characters');
  if (password.length < 6) return showMsg('reg-msg', 'Password must be at least 6 characters');

  setLoading('reg-btn', true);
  showMsg('reg-msg', 'Generating your encryption keys…', 'info');

  try {
    const keyPair = await generateKeyPair();
    const pubKeyB64 = await exportPublicKey(keyPair.publicKey);

    // Wrap private key with password so the server can store an encrypted backup
    showMsg('reg-msg', 'Wrapping private key…', 'info');
    const { wrapped_private_key, pbkdf2_salt } = await wrapPrivateKey(keyPair.privateKey, password);

    await apiPost('/auth/register', {
      username,
      password,
      public_key: pubKeyB64,
      display_name: username,
      wrapped_private_key,
      pbkdf2_salt,
    });

    // Also store private key locally in IndexedDB
    await storePrivateKey(username, keyPair.privateKey);

    showMsg('reg-msg', 'Account created! You can now sign in.', 'success');
    setTimeout(() => {
      document.getElementById('login-user').value = username;
      switchTab('login');
      hideMsg('reg-msg');
    }, 1200);
  } catch (e) {
    showMsg('reg-msg', e.message);
  } finally {
    setLoading('reg-btn', false);
  }
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  hideMsg('login-msg');

  if (!username || !password) return showMsg('login-msg', 'Please fill in all fields');

  setLoading('login-btn', true);
  showMsg('login-msg', 'Authenticating…', 'info');

  try {
    // POST to /auth/login
    const loginData = await apiPost('/auth/login', { username, password });

    state.username = username;

    // Load private key from IndexedDB first
    showMsg('login-msg', 'Loading your private key…', 'info');
    let privateKey = await loadPrivateKey(username);

    if (!privateKey) {
      // Try to recover from server's wrapped_private_key (works on new devices)
      const wrappedB64 = loginData.wrapped_private_key;
      if (wrappedB64) {
        showMsg('login-msg', 'Recovering key from server backup…', 'info');
        try {
          privateKey = await unwrapPrivateKey(wrappedB64, password);
          await storePrivateKey(username, privateKey);
        } catch {
          showMsg('login-msg', 'Key recovery failed — password may have changed. Regenerating…', 'info');
        }
      }

      // Last resort: generate a fresh keypair and update the server
      if (!privateKey) {
        showMsg('login-msg', 'No local key found. Regenerating…', 'info');
        const keyPair = await generateKeyPair();
        const pubKeyB64 = await exportPublicKey(keyPair.publicKey);
        const { wrapped_private_key, pbkdf2_salt } = await wrapPrivateKey(keyPair.privateKey, password);
        try {
          await apiPost('/auth/register', { username, password, public_key: pubKeyB64, display_name: username, wrapped_private_key, pbkdf2_salt });
        } catch { /* already registered — server may not have update-key endpoint */ }
        await storePrivateKey(username, keyPair.privateKey);
        privateKey = keyPair.privateKey;
      }
    }

    state.keyPair = { privateKey };
    hideMsg('login-msg');
    enterApp();
  } catch (e) {
    showMsg('login-msg', e.message);
  } finally {
    setLoading('login-btn', false);
  }
}

function doLogout() {
  if (state.pollingTimer) clearInterval(state.pollingTimer);
  state = { username: null, keyPair: null, conversations: {}, activeConv: null, publicKeys: {}, pollingTimer: null };
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').classList.add('active');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
  showToast('Signed out. Keys remain on device.', 'success');
}

// ── APP INIT ──────────────────────────────────────

function enterApp() {
  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('app-screen').style.display = 'flex';

  document.getElementById('my-username-display').textContent = state.username;
  document.getElementById('my-avatar').textContent = state.username[0].toUpperCase();

  loadConversations();
  state.pollingTimer = setInterval(loadConversations, 5000);
}

// ── CONVERSATIONS ──────────────────────────────────

async function loadConversations() {
  try {
    // FIX: use /messages/{username} — the backend filters by username
    const msgs = await apiGet(`/messages/${encodeURIComponent(state.username)}`);
    const list = Array.isArray(msgs) ? msgs : [];

    const convs = {};
    for (const msg of list) {
      // Determine conversation partner
      const partner = msg.sender === state.username ? msg.recipient : msg.sender;
      if (!partner) continue;
      if (!convs[partner]) convs[partner] = [];
      convs[partner].push(msg);
    }

    for (const [partner, newMsgs] of Object.entries(convs)) {
      const existing = state.conversations[partner] || [];
      const existingIds = new Set(existing.map(m => m.id));
      const fresh = newMsgs.filter(m => !existingIds.has(m.id));
      state.conversations[partner] = [...existing, ...fresh].sort((a, b) => a.id - b.id);
    }

    renderConvList();
    if (state.activeConv) renderMessages(state.activeConv);
  } catch { /* silent fail on polling */ }
}

function renderConvList() {
  const list = document.getElementById('conv-list');
  const search = document.getElementById('search-input').value.toLowerCase();
  const partners = Object.keys(state.conversations).filter(p => p.toLowerCase().includes(search));

  if (partners.length === 0) {
    list.innerHTML = '<div style="padding:40px 20px;text-align:center"><p style="font-size:13px;color:var(--text3)">No conversations yet.<br/>Start one with the + button.</p></div>';
    return;
  }

  list.innerHTML = partners.map(partner => {
    const msgs = state.conversations[partner];
    const last = msgs[msgs.length - 1];
    const isActive = state.activeConv === partner;
    const time = last ? formatTime(last.timestamp) : '';
    return `<div class="conv-item ${isActive ? 'active' : ''}" onclick="openConversation('${escHtml(partner)}')">
      <div class="conv-avatar">${partner[0].toUpperCase()}</div>
      <div class="conv-meta">
        <div class="conv-name">${escHtml(partner)}</div>
        <div class="conv-preview">🔒 Encrypted message</div>
      </div>
      <div class="conv-time">${time}</div>
    </div>`;
  }).join('');
}

function filterConvs() { renderConvList(); }

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(typeof ts === 'number' ? ts * 1000 : ts);
  const diff = Date.now() - d;
  if (diff < 60000) return 'now';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m`;
  if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── OPEN CONVERSATION ─────────────────────────────

async function openConversation(partner) {
  state.activeConv = partner;
  renderConvList();

  const main = document.getElementById('chat-main');
  main.innerHTML = `
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-avatar">${partner[0].toUpperCase()}</div>
        <div>
          <div class="chat-header-name">${escHtml(partner)}</div>
          <div class="chat-header-sub"><div class="key-dot"></div>End-to-end encrypted</div>
        </div>
      </div>
      <div class="enc-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        AES-GCM + RSA-OAEP
      </div>
    </div>
    <div class="messages-area" id="messages-area">
      <div class="sys-msg"><span>Messages are end-to-end encrypted. WhisperBox cannot read them.</span></div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea class="composer-input" id="composer-input" rows="1"
          placeholder="Message ${escHtml(partner)}…"
          onkeydown="handleComposerKey(event)"
          oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="composer-info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Encrypted before sending · Server stores ciphertext only
      </div>
    </div>`;

  renderMessages(partner);
}

async function renderMessages(partner) {
  const area = document.getElementById('messages-area');
  if (!area) return;
  const msgs = state.conversations[partner] || [];
  area.innerHTML = '<div class="sys-msg"><span>Messages are end-to-end encrypted. WhisperBox cannot read them.</span></div>';

  for (const msg of msgs) {
    const isMe = msg.sender === state.username;
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${isMe ? 'me' : 'them'}`;

    let text = msg._decrypted;
    if (text === undefined) {
      try {
        const ek = msg.encrypted_key || msg.encryptedKey;
        const ct = msg.ciphertext || msg.content;
        const iv = msg.iv;
        if (ek && ct && iv) {
          text = await decryptMessage(ct, iv, ek, state.keyPair.privateKey);
        } else {
          text = '[Unknown message format]';
        }
        msg._decrypted = text;
      } catch {
        text = '[Decryption failed — key mismatch]';
        msg._decrypted = text;
      }
    }

    const failed = text.startsWith('[');
    const ts = formatTime(msg.timestamp);
    const initials = (isMe ? state.username : partner)[0].toUpperCase();

    wrap.innerHTML = `
      ${!isMe ? `<div class="msg-avatar">${initials}</div>` : ''}
      <div>
        <div class="msg-bubble ${failed ? 'msg-error' : ''}">${escHtml(text)}</div>
        <div class="msg-meta">${ts} <span class="msg-enc-tick">🔒</span></div>
      </div>
      ${isMe ? `<div class="msg-avatar">${initials}</div>` : ''}`;
    area.appendChild(wrap);
  }

  area.scrollTop = area.scrollHeight;
}

// ── SEND ─────────────────────────────────────────

async function getRecipientPublicKey(username) {
  if (state.publicKeys[username]) return state.publicKeys[username];
  const data = await apiGet(`/users/${encodeURIComponent(username)}`);
  const pubKeyB64 = data.public_key || data.publicKey;
  if (!pubKeyB64) throw new Error(`No public key found for ${username}`);
  const key = await importPublicKey(pubKeyB64);
  state.publicKeys[username] = key;
  return key;
}

async function sendMessage() {
  const input = document.getElementById('composer-input');
  const plaintext = input.value.trim();
  if (!plaintext) return;

  const partner = state.activeConv;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  input.disabled = true;

  try {
    const recipientKey = await getRecipientPublicKey(partner);
    const { ciphertext, iv, encryptedKey } = await encryptMessage(plaintext, recipientKey);

    // FIX: include sender in payload so backend stores it correctly
    const result = await apiPost('/messages', {
      sender: state.username,
      recipient: partner,
      ciphertext,
      iv,
      encrypted_key: encryptedKey,
    });

    const localMsg = {
      id: result.id || Date.now(),
      sender: state.username,
      recipient: partner,
      ciphertext, iv, encrypted_key: encryptedKey,
      timestamp: Date.now() / 1000,
      _decrypted: plaintext,
    };
    if (!state.conversations[partner]) state.conversations[partner] = [];
    state.conversations[partner].push(localMsg);

    input.value = '';
    input.style.height = 'auto';
    renderMessages(partner);
    renderConvList();
  } catch (e) {
    showToast(`Send failed: ${e.message}`, 'error');
  } finally {
    btn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

async function sendNewMsg() {
  const recipient = document.getElementById('new-msg-recipient').value.trim();
  const body = document.getElementById('new-msg-body').value.trim();
  hideMsg('new-msg-error');

  if (!recipient || !body) return showMsg('new-msg-error', 'Please fill in recipient and message');
  if (recipient === state.username) return showMsg('new-msg-error', "You can't message yourself");

  showMsg('new-msg-error', 'Encrypting…', 'info');

  try {
    const recipientKey = await getRecipientPublicKey(recipient);
    const { ciphertext, iv, encryptedKey } = await encryptMessage(body, recipientKey);

    const result = await apiPost('/messages', {
      sender: state.username,
      recipient,
      ciphertext,
      iv,
      encrypted_key: encryptedKey,
    });

    const localMsg = {
      id: result.id || Date.now(),
      sender: state.username,
      recipient,
      ciphertext, iv, encrypted_key: encryptedKey,
      timestamp: Date.now() / 1000,
      _decrypted: body,
    };
    if (!state.conversations[recipient]) state.conversations[recipient] = [];
    state.conversations[recipient].push(localMsg);

    closeNewMsg();
    showToast('Message encrypted and sent', 'success');
    openConversation(recipient);
    renderConvList();
  } catch (e) {
    showMsg('new-msg-error', e.message);
  }
}

// ── UI HELPERS ────────────────────────────────────

function handleComposerKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function openNewMsg() {
  document.getElementById('new-msg-modal').classList.add('open');
  document.getElementById('new-msg-recipient').value = '';
  document.getElementById('new-msg-body').value = '';
  hideMsg('new-msg-error');
  setTimeout(() => document.getElementById('new-msg-recipient').focus(), 100);
}

function closeNewMsg() {
  document.getElementById('new-msg-modal').classList.remove('open');
}

document.getElementById('new-msg-modal').addEventListener('click', function (e) {
  if (e.target === this) closeNewMsg();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginForm = document.getElementById('login-form');
    const regForm = document.getElementById('register-form');
    if (loginForm.style.display !== 'none' && document.activeElement?.closest('#login-form')) doLogin();
    if (regForm.style.display !== 'none' && document.activeElement?.closest('#register-form')) doRegister();
  }
});
